<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>404 — Page Not Found | Stackly</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
/* ===== RESET & ROOT ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0A0E1A;
  --bg2: #0F1320;
  --bg3: #13172A;
  --surface: #14182B;
  --surface2: #1A1F38;
  --primary: #4F46E5;
  --primary2: #6366F1;
  --primary3: #818CF8;
  --accent: #F59E0B;
  --accent2: #FBBF24;
  --ivory: #F3F4F6;
  --text: #F9FAFB;
  --text2: #9CA3AF;
  --text3: #6B7280;
  --border: rgba(79,70,229,0.25);
  --border2: rgba(79,70,229,0.12);
  --nav-h: 80px;
}

html, body {
  width: 100%;
  height: 100%;
  scroll-behavior: smooth;
  overflow-x: hidden;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

h1, h2, h3, h4, h5 {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
}

/* ===== ANIMATIONS ===== */
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes floatAlt { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes spinSlow { to { transform: rotate(360deg); } }
@keyframes gridDrift { to { background-position: 50px 50px; } }
@keyframes zoomBg { 0% { transform: scale(1); } 100% { transform: scale(1.07); } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.4); } 50% { box-shadow: 0 0 0 6px rgba(245,158,11,0); } }

/* ===== BACKGROUND LAYERS ===== */
.bg-photo {
  position: absolute; inset: 0;
  background: url('.//img/360_F_1791120397_FgyNQwxVL8siO822piOCLmhdTnsXJgRh.webp') center/cover no-repeat;
  animation: zoomBg 25s ease-in-out infinite alternate;
  z-index: 0;
}
.bg-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(10,14,26,.92) 0%, rgba(15,19,32,.96) 100%);
  z-index: 1;
}
.bg-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(var(--border2) 1px, transparent 1px), linear-gradient(90deg, var(--border2) 1px, transparent 1px);
  background-size: 50px 50px;
  animation: gridDrift 30s linear infinite;
  pointer-events: none;
  z-index: 2;
}
.orb {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(79,70,229,.15), transparent 70%);
  z-index: 2;
}
.orb-tl { width: 350px; height: 350px; top: -140px; right: -140px; animation: float 10s ease-in-out infinite; }
.orb-bl { width: 280px; height: 280px; bottom: -120px; left: -120px; background: radial-gradient(circle, rgba(245,158,11,.12), transparent 70%); animation: floatAlt 12s ease-in-out infinite; }
.orb-mid { width: 200px; height: 200px; top: 40%; left: 8%; animation: spinSlow 25s linear infinite; }

/* ===== NAVBAR ===== */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: var(--nav-h);
  padding: 0 5%;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(10,14,26,.95);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border2);
}
.nav-logo {
  display: flex; align-items: center; gap: 6px;
  font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800;
  color: var(--ivory); cursor: pointer;
  transition: transform .3s;
}
.nav-logo:hover { transform: scale(1.04); }
.nav-logo span { color: var(--accent); }
.nav-logo-img { height: 38px; width: auto; object-fit: contain; }
.nav-links {
  display: flex; align-items: center; gap: 1.6rem; list-style: none;
}
.nav-links a {
  color: var(--text); font-size: .75rem; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
  cursor: pointer; transition: color .3s;
  text-decoration: none;
}
.nav-links a:hover { color: var(--accent); }
.nav-auth { display: flex; align-items: center; gap: .8rem; }
.btn-ghost {
  background: transparent; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 40px;
  padding: .5rem 1.2rem; font-size: .8rem; font-weight: 600;
  cursor: pointer; transition: background .3s, transform .3s;
}
.btn-ghost:hover { background: rgba(245,158,11,.15); transform: translateY(-2px); }

/* ===== 404 MAIN CONTENT ===== */
.error-main {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(var(--nav-h) + 2rem) 5% 3rem;
  overflow: hidden;
}
.error-card {
  position: relative;
  z-index: 3;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  background: rgba(20,24,43,.88);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 32px;
  padding: 2.8rem 2rem;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  transition: transform .3s ease;
}
.error-card:hover { transform: translateY(-5px); }
.error-num {
  font-family: 'Syne', sans-serif;
  font-size: 6rem;
  font-weight: 800;
  line-height: 1;
  background: linear-gradient(135deg, var(--accent), var(--primary3), var(--accent));
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 3s linear infinite;
  margin-bottom: 0.5rem;
}
.error-icon {
  font-size: 3.5rem;
  margin-bottom: 0.5rem;
  color: var(--accent);
  animation: float 2s ease-in-out infinite;
  display: inline-block;
}
.error-title {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--ivory);
  margin-bottom: 0.75rem;
}
.error-msg {
  color: var(--text2);
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 2rem;
}
.btn-home {
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 0.9rem 2rem;
  border-radius: 40px;
  font-weight: 700;
  font-size: 0.9rem;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: background .3s, transform .3s, box-shadow .3s;
  cursor: pointer;
  text-decoration: none;
}
.btn-home:hover {
  background: var(--accent2);
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(245,158,11,.3);
}


/* ===== FOOTER ===== */
.error-footer {
  position: relative;
  z-index: 3;
  text-align: center;
  padding: 1.5rem 5%;
  border-top: 1px solid var(--border2);
  font-size: 0.7rem;
  color: var(--text3);
  background: rgba(10,14,26,.7);
  backdrop-filter: blur(8px);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .nav-links, .nav-auth { display: none; }
  .error-num { font-size: 4rem; }
  .error-title { font-size: 1.4rem; }
  .error-card { padding: 1.8rem 1.2rem; }
  .error-icon { font-size: 2.5rem; }
  .error-msg { font-size: 0.85rem; }
  .suggest-links a { padding: 0.5rem 1rem; font-size: 0.75rem; }
}
@media (max-width: 480px) {
  .error-num { font-size: 3rem; }
  .error-title { font-size: 1.2rem; }
  .error-card { padding: 1.5rem 1rem; }
  .btn-home { padding: 0.7rem 1.5rem; font-size: 0.8rem; }
  .suggest-links { gap: 0.6rem; }
  .suggest-links a { padding: 0.45rem 0.9rem; font-size: 0.7rem; }
}
</style>
</head>
<body>

<!-- BACKGROUND LAYERS -->
<div class="bg-photo"></div>
<div class="bg-overlay"></div>
<div class="bg-grid"></div>
<div class="orb orb-tl"></div>
<div class="orb orb-bl"></div>
<div class="orb orb-mid"></div>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-logo" onclick="window.location.href='index.html'">
    <img src=".//img/ChatGPT_Image_Jun_3__2026__11_44_40_AM-removebg-preview-removebg-preview.webp" alt="Stackly" class="nav-logo-img"/>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="#">Courses</a></li>
    <li><a href="#">Subjects</a></li>
    <li><a href="#">Instructors</a></li>
    <li><a href="#">Pricing</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
  <div class="nav-auth">
    <button class="btn-ghost" onclick="window.location.href='index.html'">Log in</button>
    <button class="btn-ghost" onclick="window.location.href='index.html'">Start Free →</button>
  </div>
</nav>

<!-- 404 CONTENT -->
<main class="error-main">
  <div class="error-card">
    <div class="error-num">404</div>
    <div class="error-icon">🔍</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-msg">Oops! The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>
    <button class="btn-home" onclick="window.location.href='index.html'">
      🏠 Back to Home
    </button>
   
  </div>
</main>

<footer class="error-footer">
  <span>© 2026 Stackly Education — Page Not Found</span>
</footer>

</body>
</html>
